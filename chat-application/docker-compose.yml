# =============================================================================
# Messenger – Docker Compose
#
# Usage:
#   1. cp backend/.env.example backend/.env  and fill in real values
#   2. Create a .env file in THIS directory with the secrets listed below, OR
#      export them as shell variables before running docker compose.
#   3. docker compose up --build
#
# Required shell / .env secrets (at repo root):
#   JWT_SECRET, RESEND_API_KEY, EMAIL_FROM, EMAIL_FROM_NAME,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
#   ARCJET_KEY
#
# Services:
#   mongo     – MongoDB 7                 (internal only)
#   redis     – Redis 7                   (internal only)
#   backend   – Node/Express/Socket.io    → localhost:3000
#   worker    – BullMQ email worker       (internal background processor)
#   frontend  – nginx serving React SPA   → localhost:80
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chat
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend  (Node / Express / Socket.io)
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/chat
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Messenger}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ARCJET_KEY: ${ARCJET_KEY}
      ARCJET_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # ---------------------------------------------------------------------------
  # Worker  (BullMQ background queue worker for emails)
  # ---------------------------------------------------------------------------
  worker:
    build: ./backend
    command: npm run start:worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/chat
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Messenger}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # ---------------------------------------------------------------------------
  # Frontend  (nginx serving Vite build, proxies /api + /socket.io to backend)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  mongo_data:
  redis_data:
